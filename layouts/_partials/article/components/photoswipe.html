{{- $opts := dict "minify" hugo.IsProduction -}}
{{- $galleryScript := resources.Get "ts/photoswipe.ts" | js.Build $opts | fingerprint -}}

<script type="text/javascript" src="{{ $galleryScript.RelPermalink }}" defer></script>
<script>
    window.PhotoSwipeConfig = {
        style: {{ hugo.Data.external.PhotoSwipe.Style | jsonify | safeJS }},
        core: {{ hugo.Data.external.PhotoSwipe.Core | jsonify | safeJS }},
        lightbox: {{ hugo.Data.external.PhotoSwipe.Lightbox | jsonify | safeJS }}
    };
</script>
